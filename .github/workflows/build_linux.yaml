# Check that the Qt version of the game builds on Linux
name: Build on Linux

on:
  push:
  pull_request:

# Keep this the same as in build_web.yaml
env:
  QT_VERSION: 6.11.3

jobs:
  build_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        # Uses aqtinstall, as installing Qt with apt-get can hang
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtmultimedia -O "$HOME/qt"

      - name: Build
        run: |
          mkdir build
          cd build
          # Qt links to libGL. The runner has libGL.so.1, but not the libGL.so
          # of libgl-dev, which cannot be installed, as the runner cannot
          # reach the Ubuntu package servers. So link to libGL.so.1 directly
          mkdir gl
          ln -s "$(ldconfig -p | grep -m1 'libGL.so.1 ' | awk '{print $NF}')" gl/libGL.so
          ls -l gl
          # Qt Multimedia needs PulseAudio, which is missing for the same reason.
          # This only checks that the game builds, so ignore the symbols
          # that Qt's own libraries need
          "$HOME/qt/$QT_VERSION/gcc_64/bin/qmake" ../publictoiletmanager.pro "LIBS += -L$PWD/gl" "QMAKE_LFLAGS += -Wl,--allow-shlib-undefined"
          make -j4
