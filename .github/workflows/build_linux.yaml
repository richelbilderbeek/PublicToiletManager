# Check that the Qt version of the game builds on Linux
name: Build on Linux

on:
  push:
  pull_request:

# Keep this the same as in build_web.yaml
env:
  QT_VERSION: 6.11.3

jobs:
  build_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        # Uses aqtinstall, as installing Qt with apt-get can hang
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtmultimedia -O "$HOME/qt"

      - name: Install OpenGL development files
        # Qt Widgets links to libGL
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev

      - name: Build
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/gcc_64/bin/qmake" ../publictoiletmanager.pro
          make -j4
