# Check that the Qt version of the game builds on Linux
name: Build on Linux

on:
  push:
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl-dev

      - name: Build
        run: |
          mkdir build
          cd build
          qmake6 ../publictoiletmanager.pro
          make -j4
