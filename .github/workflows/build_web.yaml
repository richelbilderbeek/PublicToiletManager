# Build the web (WebAssembly) version of the game
# and check that it starts in a browser.
# The website workflow (create_zensical_website.yaml) builds the
# game in the same way and puts it on the 'Play' page
name: Build web version

on:
  push:
  pull_request:

# Keep these the same as in create_zensical_website.yaml
env:
  QT_VERSION: 6.11.3
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ../publictoiletmanager.pro
          make -j4
      - name: Collect web files
        run: |
          mkdir dist
          cp build/*.html build/*.js build/*.wasm dist/
          cp build/*.svg dist/ || true
          mkdir dist/sounds
          cp *.wav dist/sounds/
      - name: Smoke test in a browser
        run: |
          pip install playwright
          (cd dist && python3 -m http.server 8000) &
          sleep 2
          python3 .github/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: publictoiletmanager_web
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publictoiletmanager_web_screenshots
          path: '*.png'
