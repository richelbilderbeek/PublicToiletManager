# Build the Qt version of the game on Windows,
# creating a Windows executable as a workflow artifact
name: Build on Windows

on:
  push:
  pull_request:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\publictoiletmanager.pro
          nmake release

      - name: Collect the executable and the Qt libraries it needs
        shell: cmd
        run: |
          mkdir publictoiletmanager
          copy build\release\publictoiletmanager.exe publictoiletmanager\
          copy LICENSE publictoiletmanager\
          windeployqt --release --no-translations publictoiletmanager\publictoiletmanager.exe

      - uses: actions/upload-artifact@v4
        with:
          name: publictoiletmanager_windows
          path: publictoiletmanager
