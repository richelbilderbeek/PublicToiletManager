# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create_zensical_website.yaml
      - 'docs/**'
      - zensical.toml
      # The game
      - '*.cpp'
      - '*.h'
      - '*.pro'
      - '*.qrc'
      - '*.wav'
      - '*.bmp'
      - '*.cur'

# Keep these the same as in build_web.yaml
env:
  QT_VERSION: 6.11.3
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  create_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build the game
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ../publictoiletmanager.pro
          make -j4
      - name: Add the game to the website
        run: |
          mkdir docs/game
          cp build/*.html build/*.js build/*.wasm docs/game/
          cp build/*.svg docs/game/ || true
          mkdir docs/game/sounds
          cp *.wav docs/game/sounds/
      - run: pip install zensical
      - run: zensical build --clean --strict
      - name: Check that the 'Play' page finds the game
        run: |
          src=$(grep -o '<iframe src="[^"]*"' site/play/index.html | cut -d '"' -f 2)
          echo "The iframe loads '$src'"
          test -f "site/play/$src"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
