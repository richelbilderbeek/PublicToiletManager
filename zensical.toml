[project]
site_name = "Public Toilet Manager"
site_url = "https://richelbilderbeek.github.io/publictoiletmanager/"
repo_url = "https://github.com/richelbilderbeek/publictoiletmanager"
edit_uri = "blob/master/docs/"

nav = [
  { "Start" = "README.md"},
  "how_to_play.md",
  "faq.md",
]

[project.theme]
# https://zensical.org/docs/setup/basics/?h=theme#theme-variant
variant = "classic"
palette.primary = "black"

favicon = "icon.png"
logo = "icon.png"

# https://zensical.org/docs/setup/language/
language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.integrate",
]
